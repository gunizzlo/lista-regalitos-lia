<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de regalitos de Lía Isabella</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Libre+Baskerville:wght@400;700&display=swap">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FFF4EE;font-family:"Libre Baskerville",Georgia,serif;color:#5A4034;text-align:center;padding:24px;box-sizing:border-box}
.box{max-width:420px}
h1{font-family:"Great Vibes",cursive;font-size:3rem;color:#D4617A;margin:0 0 8px}
p{line-height:1.7;margin:12px 0}
.emoji{font-size:2.5rem;margin-bottom:8px}
.tiempo{display:inline-block;background:#FFD6D0;border-radius:99px;padding:.4em 1.2em;font-weight:700;color:#B8425E;margin-top:8px;font-size:1rem}
</style>
</head>
<body>
<div class="box">
  <div class="emoji">🎀</div>
  <h1>Lista de regalitos</h1>
  <p><strong>para Lía Isabella</strong></p>
  <p>Estamos terminando unos últimos detalles de la lista.<br>¡Volvé en un ratito!</p>
  <div class="tiempo">⏰ Estará lista en aproximadamente 1 hora</div>
  <p style="margin-top:24px;font-size:.9rem;color:#8A6F62">Gracias por la paciencia y por tanto amor 💕</p>
</div>
</body>
</html>
